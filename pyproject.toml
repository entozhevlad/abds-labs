[project]
name = "energosbyt"
version = "0.1.0"
description = "Лабораторная работа: SCD в ClickHouse"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.12",
    "pydantic==2.11.4",
    "uvicorn==0.34.2",
    "dependency-injector==4.48.2",
    "ruff>=0.17.4",
    "mypy>=2.4.1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["app", "tests"]
strict = true

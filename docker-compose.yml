services:
  clickhouse:
    image: ${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:26.7}
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-energosbyt}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_SKIP_USER_SETUP: ${CLICKHOUSE_SKIP_USER_SETUP:-1}
      TZ: ${TZ:-UTC}
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_PORT:-9000}:9000"
    volumes:
      - ${VOLUME_DIR:-./volume}:/var/lib/clickhouse
    healthcheck:
      test: [CMD-SHELL, 'clickhouse-client --user "$${CLICKHOUSE_USER}" --password "$${CLICKHOUSE_PASSWORD}" --query "SELECT 1"']
      interval: ${HEALTHCHECK_INTERVAL:-2s}
      timeout: ${HEALTHCHECK_TIMEOUT:-5s}
      retries: ${CLICKHOUSE_HEALTHCHECK_RETRIES:-60}
  app:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.10.6}
    env_file: .env.local
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: 8123
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, 'import os, urllib.request; urllib.request.urlopen("http://127.0.0.1:" + os.environ["APP_PORT"] + "/ping")']
      interval: ${HEALTHCHECK_INTERVAL:-2s}
      timeout: ${HEALTHCHECK_TIMEOUT:-5s}
      retries: ${APP_HEALTHCHECK_RETRIES:-30}

services:
  clickhouse:
    image: ${CLICKHOUSE_IMAGE:?}
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:?}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_SKIP_USER_SETUP: ${CLICKHOUSE_SKIP_USER_SETUP:?}
      TZ: ${TZ:?}
    ports:
      - "${CLICKHOUSE_HTTP_PORT:?}:8123"
      - "${CLICKHOUSE_PORT:?}:9000"
    volumes:
      - ${VOLUME_DIR:?}:/var/lib/clickhouse
    healthcheck:
      test: [CMD-SHELL, 'clickhouse-client --user "$${CLICKHOUSE_USER}" --password "$${CLICKHOUSE_PASSWORD}" --query "SELECT 1"']
      interval: ${HEALTHCHECK_INTERVAL:?}
      timeout: ${HEALTHCHECK_TIMEOUT:?}
      retries: ${CLICKHOUSE_HEALTHCHECK_RETRIES:?}
  app:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:?}
        UV_IMAGE: ${UV_IMAGE:?}
    env_file: .env.local
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: 8123
    ports:
      - "${APP_PORT:?}:${APP_PORT:?}"
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, 'import os, urllib.request; urllib.request.urlopen("http://127.0.0.1:" + os.environ["APP_PORT"] + "/ping")']
      interval: ${HEALTHCHECK_INTERVAL:?}
      timeout: ${HEALTHCHECK_TIMEOUT:?}
      retries: ${APP_HEALTHCHECK_RETRIES:?}
